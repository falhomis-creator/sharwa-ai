[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE", "SIM", "S", "RUF"]
ignore = [
    "B008",    # Depends(...)/require_role(...) in argument defaults is the required FastAPI idiom
    "S101",    # assert is normal in pytest test files
    "RUF001", "RUF002", "RUF003",  # this codebase quotes the Arabic spec verbatim throughout comments/docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", "S105", "S106",  # asserts, and test-only hardcoded dev passwords/tokens
    "S311",                  # non-crypto randomness for picking test fixture pairs, not a secret
    "S603", "S607",          # subprocess calls with fixed, trusted, hardcoded arguments (lint-imports, migrate re-runs)
    "N802",                  # do_GET/do_POST - required spelling for http.server.BaseHTTPRequestHandler
    "SLF001",                # deliberate white-box access to module-private state for one low-level probe test
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["psycopg_pool.*", "jwt.*"]
ignore_missing_imports = true
