# ops/proxy/nginx-ai.sharwaah.com.conf - P4 Task 17: ALTERNATIVE to ops/proxy/Caddyfile.
#
# Use this ONLY if the VPS already runs nginx on ports 80/443 (e.g. for the
# Sharwa Django site) - two servers cannot both own 80/443. Otherwise prefer
# the Caddyfile (automatic certificates, nothing to renew by hand).
# Same allow-list and limits as the Caddyfile; the certificate comes from
# certbot (webroot). Guide: docs/VPS_DEPLOYMENT_PLAYBOOK.md section 12.
#
# Install: /etc/nginx/conf.d/sharwa-ai.conf  (http{} context).
# Replace ai.sharwaah.com and 8100 (API_HOST_PORT) if yours differ.

map $http_upgrade $sharwa_ai_connection_upgrade {
    default upgrade;
    ''      close;
}

# The access log keeps the path only ($uri, no query string): the one-time
# WebSocket ticket (/v1/ws?ticket=...) never reaches a log file.
log_format sharwa_ai_noquery '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream sharwa_ai_api {
    server 127.0.0.1:8100;
    keepalive 16;
}

# --- port 80: ACME challenge + redirect everything else to https ---------------
server {
    listen 80;
    listen [::]:80;
    server_name ai.sharwaah.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- port 443: the api ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.sharwaah.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ai.sharwaah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.sharwaah.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sharwa_ai_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/sharwa-ai.access.log sharwa_ai_noquery;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_hide_header Server;   # nginx still sends "Server: nginx" (no version: server_tokens off)

    # Platform webhooks (Sharwa -> engine): api enforces 256 KiB + HMAC itself.
    location = /webhooks/platform/catalog {
        client_max_body_size 512k;
        proxy_pass http://sharwa_ai_api;
    }
    location = /webhooks/platform/cart {
        client_max_body_size 512k;
        proxy_pass http://sharwa_ai_api;
    }
    # P4 Task 14: the platform resolves a customer's gift link (signed, tiny body).
    location = /webhooks/platform/gift-cart {
        client_max_body_size 8k;
        proxy_pass http://sharwa_ai_api;
    }

    # Live inbox WebSocket (ticket auth; Origin checked by the api).
    location = /v1/ws {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $sharwa_ai_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://sharwa_ai_api;
    }

    location = /v1 {
        return 404;
    }
    location /v1/ {
        proxy_pass http://sharwa_ai_api;
    }

    location = /console {
        return 308 /console/;
    }
    location /console/ {
        proxy_pass http://sharwa_ai_api;
    }

    location = /healthz {
        proxy_pass http://sharwa_ai_api;
    }

    # Everything else (including /metrics, /readyz, /docs, /openapi.json): 404.
    location / {
        return 404;
    }
}
