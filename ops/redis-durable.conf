# ops/redis-durable.conf
# Durable Redis (risk #17 / #5): streams (inbound WAL), lidmap hashes, wake-ups.
# Nothing that "must not be lost" is ever evicted or dropped.
#
# Why AOF fsync=always and no RDB: fsync=always ack's every write before the
# XADD returns, so a `kill -9` cannot lose an acknowledged message; `save ""`
# disables RDB snapshots entirely (AOF is the single persistence path).
# requirepass is injected via a container environment variable (never committed).

bind * -::*
protected-mode yes
port 6379
tcp-keepalive 60

appendonly yes
appendfsync always
save ""

maxmemory 128mb
maxmemory-policy noeviction

# AOF rewrite headroom (audit B3): a rewrite forks and adds copy-on-write plus a
# rewrite buffer; keep maxmemory below the container's 320m limit so the rewrite
# cannot push the container into OOM (risk #16/#17).
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
