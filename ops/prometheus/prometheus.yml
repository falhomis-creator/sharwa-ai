# ops/prometheus/prometheus.yml
# P0.6 closure (Batch C, monitoring). Scrapes gateway (real /metrics, already
# built in Batch A/B) and gateway-forwarder (real /metrics, added in this same
# batch - see gateway/src/forwarder.js/forwarder_metrics.js).
#
# P1.0 (this change) adds the two remaining targets the spec always asked for
# and that now exist for real: `api` (P0.7, :8080) and `worker-realtime`
# (P1.0, :4003). P0_DEVIATIONS.md D-22's deferral ("api not scraped yet") is
# now closed - every target below is a real, booting service, never fabricated.
#
# All jobs authenticate with the same METRICS_TOKEN each process already
# requires to boot (H5) via bearer_token_file - the token itself is never
# written into this file (never committed - see .gitignore).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['gateway:4001']

  - job_name: gateway-forwarder
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['gateway-forwarder:4002']

  - job_name: api
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['api:8080']

  - job_name: worker-realtime
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['worker-realtime:4003']
