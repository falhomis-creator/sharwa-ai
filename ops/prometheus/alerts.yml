# ops/prometheus/alerts.yml
# P0.6 closure (Batch C). The exact 8 rules the spec requires
# (prompts/P0_DEEPSEEK_PROMPT.md P0.6 §6): gateway down, redis-durable memory
# > 60%, spool non-empty > 5min, dlq_length > 0, a `banned` session, heap >
# 85% of its configured cap, the oldest pending stream message > 60s, and
# process_open_fds > 70% of its cap.
#
# Spec's own explicit P0 posture (literal text): "Alertmanager/إشعارات
# التسليم تُضاف في P1؛ في P0 القواعد مرئية في واجهة Prometheus" - these rules
# only need to be VISIBLE in the Prometheus UI in P0, not wired to any
# delivery channel (no Alertmanager service exists, deliberately - P1 scope).
#
# One of the eight references a metric this repository does not produce yet -
# documented explicitly here AND in docs/P0_DEVIATIONS.md, per the spec's own
# instruction to record such gaps rather than hide them:
#   - redis-durable memory %: needs a redis_exporter (oliver006/redis_exporter
#     or equivalent) scraping redis-durable's INFO memory stats - no such
#     service exists in docker-compose.yml (adding a whole new exporter
#     service was judged out of scope for "wire the alert rules text";
#     written using that exporter's real, standard metric names so the rule
#     activates the moment one is added, with no rewrite needed).
#
# session `banned` state (SessionBanned rule): VERIFIED against the real
# gateway/src/sessions.js - mapConnectionStatus() (line ~270-281) returns the
# UPPERCASE literal 'BANNED' (alongside 'QR_PENDING'/'CONNECTED'/
# 'DISCONNECTED'/'UNKNOWN' - all uppercase, explicitly commented there as
# "contract-frozen vocabulary"), and metrics.js's recordSessionStateTransition
# feeds session_state{state} with that value verbatim, no case transform. The
# rule below was corrected from an earlier draft that guessed lowercase
# "banned" before this file was read - written as state="BANNED" now that the
# real label value is confirmed, not assumed.
#
# Validated with `promtool check rules` (recorded in the delivery script's
# own self-verification output, not just asserted here).

groups:
  - name: sharwa_ai_p0
    rules:
      - alert: GatewayDown
        expr: up{job="gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "gateway is down"
          description: "Prometheus has not been able to scrape the gateway's /metrics for at least 1 minute."

      - alert: RedisDurableMemoryHigh
        # UNWIRED (see file header): requires a redis_exporter scraping
        # redis-durable; no such target exists yet. Visible only (spec's own
        # P0 allowance), not currently able to fire.
        expr: redis_memory_used_bytes{addr=~".*redis-durable.*"} / redis_memory_max_bytes{addr=~".*redis-durable.*"} > 0.6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "redis-durable memory usage above 60%"
          description: "redis-durable is using more than 60% of its configured maxmemory for at least 5 minutes."

      - alert: SpoolNonEmptyTooLong
        expr: ingest_spool_depth > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "disk spool has been non-empty for over 5 minutes"
          description: "redis-durable has likely been unreachable for a sustained period - inbound messages are spooling to disk instead of reaching the WAL."

      - alert: DeadLetterQueueNonEmpty
        expr: dlq_length > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "at least one message is parked on the dead-letter queue"
          description: "dlq:in is non-empty - one or more inbound messages exhausted FORWARD_MAX_ATTEMPTS and were never delivered to Django. Needs manual investigation/replay."

      - alert: SessionBanned
        # VERIFIED against sessions.js's real mapConnectionStatus vocabulary
        # (see file header) - the gauge label is the uppercase "BANNED".
        expr: session_state{state="BANNED"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "a WhatsApp session has been banned"
          description: "session_state reports at least one session in the banned state."

      - alert: GatewayHeapNearCap
        # Threshold hardcoded to the gateway's own NODE_OPTIONS
        # (--max-old-space-size=900, docker-compose.yml) - if that value ever
        # changes, this threshold must be updated to match (900*1024*1024 =
        # 943718400 bytes).
        expr: nodejs_heap_size_used_bytes{job="gateway"} / 943718400 > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "gateway heap usage above 85% of its configured cap"
          description: "nodejs_heap_size_used_bytes is above 85% of the 900MB --max-old-space-size budget for at least 2 minutes."

      - alert: StreamPendingTooOld
        expr: stream_pending_oldest_seconds{group="legacy-forwarder"} > 60
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "a WAL stream entry has been pending (unacked) for over 60 seconds"
          description: "the legacy-forwarder consumer group has at least one entry that has not been acked in over 60 seconds - the forwarder may be stuck, crash-looping, or Django may be down."

      - alert: OpenFileDescriptorsNearCap
        expr: process_open_fds / process_max_fds > 0.7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "open file descriptors above 70% of the process cap"
          description: "{{ $labels.job }} is using more than 70% of its process_max_fds for at least 5 minutes."

  # P1.0 (worker-realtime): the four rules the spec requires, against the
  # worker's own registry (app/obs/metrics.py). Thresholds are written and
  # justified in P1_01_REPORT.md §5.
  - name: sharwa_ai_p1
    rules:
      - alert: IngestGroupLagHigh
        expr: ingest_core_stream_lag > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "core-ingest consumer-group lag above 1000 on a shard"
          description: "shard {{ $labels.shard }} has more than 1000 unread stream entries for at least 2 minutes - the worker may be falling behind."

      - alert: IngestDlqGrowing
        expr: increase(ingest_core_dlq_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "core-ingest dead-letter queue is growing"
          description: "at least one entry was parked on dlq:in:core in the last 5 minutes - needs manual investigation/replay."

      - alert: IngestPelTooLarge
        expr: ingest_core_pel_size > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "core-ingest pending-entry-list above 500 on a shard"
          description: "shard {{ $labels.shard }} has more than 500 unacked (pending) entries for at least 5 minutes - a consumer may be stuck."

      - alert: CoreWorkerDown
        # D3: a dead container makes the metric ABSENT, not 0 - so this fires on
        # the scrape target's `up` (which Prometheus synthesizes), not on
        # core_worker_up (which only reads 0 during a clean _teardown()).
        expr: up{job="worker-realtime"} == 0 or absent(up{job="worker-realtime"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "worker-realtime is down"
          description: "Prometheus has not been able to scrape worker-realtime /metrics for at least 1 minute - the realtime ingest worker is not running."

  # P1.2 (outbound & dispatcher): four rules against the worker's outbound
  # registry. Thresholds justified in P1_02_REPORT.md. No "worker down" rule
  # here - CoreWorkerDown (above) already covers absence via up/absent (D3).
  - name: sharwa_ai_p1_2
    rules:
      - alert: DispatchOldestPendingHigh
        expr: dispatch_oldest_pending_seconds > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "oldest pending outbox row is older than 2 minutes"
          description: "the dispatcher has been unable to drain the outbox for at least 2 minutes - a reply may be stuck."

      - alert: DispatchFailuresGrowing
        expr: increase(dispatch_attempts_total{result="failed"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "dispatch failures are occurring"
          description: "at least one outbox row hit status='failed' in the last 5 minutes - a service reply could not be sent."

      - alert: EvtStreamLagHigh
        expr: evt_stream_lag > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "evt consumer-group lag above 1000 on a shard"
          description: "shard {{ $labels.shard }} has more than 1000 unread evt stream entries - sent/failed events are not being reconciled into the inbox."

      - alert: DroppedStaleRatioHigh
        expr: (increase(dispatch_attempts_total{result="dropped_stale"}[10m]) / clamp_min(increase(dispatch_attempts_total{result="sent"}[10m]), 1)) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "dropped_stale is > 20% of sent volume"
          description: "an unusually high fraction of outbox rows are being dropped as stale - possible epoch/logic bug, not natural human handoff."

  # P1.3 (inbox): two rules. Thresholds justified in P1_03_REPORT.md.
  # 5xx rate on /v1/conversations* is measured off the API request counter
  # (inbox_api_requests_total{route="conversations",status}); absence/health is
  # measured via up/absent by the existing CoreDown rules (D3) - never by a
  # metric that is simply 0 when nothing has failed.
  - name: sharwa_ai_p1_3
    rules:
      - alert: InboxConversations5xxRateHigh
        expr: >-
          sum(rate(inbox_api_requests_total{route="conversations",status=~"5.."}[5m]))
          / clamp_min(sum(rate(inbox_api_requests_total{route="conversations"}[5m])), 0.0001)
          > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "inbox conversations API 5xx rate is above 2%"
          description: "more than 2% of /v1/conversations* requests have failed with a 5xx over 5 minutes."

      - alert: StateTransitionConflictsHigh
        expr: increase(state_transitions_total{result="conflict_version"}[10m]) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "many CONFLICT_VERSION results on conversation state transitions"
          description: "more than 20 optimistic-lock conflicts in 10 minutes - staff are acting on stale screens, or the version lock has a bug."

  # P1.3b (WebSocket live stream): three rules (PROMPT §4.7). Absence/health of
  # the retention sweep is the staleness rule below, not a "0 when idle" alert
  # (D3: absence is measured via up/absent by the existing CoreDown rules).
  - name: sharwa_ai_p1_3b
    rules:
      - alert: WsPerTenantRejectionsHigh
        expr: increase(ws_rejected_total{reason="per_tenant"}[10m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket connections rejected at the per-tenant ceiling"
          description: "more than 5 per-tenant rejections in 10 minutes - a store is likely hitting its 200-connection ceiling."

      - alert: WsPongTimeoutsGrowing
        expr: increase(ws_pong_timeouts_total[10m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket pong timeouts are occurring"
          description: "at least 3 connections timed out waiting for a pong in the last 10 minutes."

      - alert: WsRetentionStale
        expr: time() - inbox_events_retention_last_run_timestamp > 7200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "inbox_events retention sweep is stale"
          description: "the retention sweep has not completed within 2x its interval (7200s = 2 x 3600s) - inbox_events may be growing unbounded."


  # P1.4 (catalog read model): three rules. Absence/health is measured via
  # up/absent by the existing CoreDown rules (D3) - never by a metric that is
  # simply 0 when nothing has failed. The staleness threshold (1800s = 2x the
  # 900s reconcile interval) means a tenant whose catalog has not reconciled in
  # 30 minutes is untrustworthy, and that must be KNOWN (risk #9).
  - name: sharwa_ai_p1_4
    rules:
      - alert: CatalogStale
        expr: catalog_staleness_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "a tenant's catalog has not reconciled in over 30 minutes"
          description: "catalog_staleness_seconds is above 1800s (2x the reconcile interval) for 5 minutes - some tenant's product data is untrustworthy."

      - alert: CatalogForbiddenFieldSeen
        expr: increase(catalog_cost_field_seen_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "a platform catalog event carried a forbidden field"
          description: "the catalog gate saw a cost/wholesale/margin field arrive from the platform in the last 5 minutes - a platform-side leak worth investigating (H36)."

      - alert: CatalogReconcileFailing
        expr: increase(catalog_reconcile_runs_total{result="failed"}[30m]) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "catalog reconciliation is repeatedly failing"
          description: "more than 3 failed reconcile runs in 30 minutes - the platform commerce API may be unreachable or misconfigured."


  # P1.5 (LLM layer & governance): four rules (PROMPT §5.8). Absence/health is
  # measured via up/absent by the existing CoreDown rules (D3) - never by a
  # metric that is simply 0 when nothing has failed.
  - name: sharwa_ai_p1_5
    rules:
      - alert: TenantBudgetDegraded
        expr: budget_state{state="degraded"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "a tenant's monthly LLM budget is degraded"
          description: "at least one tenant has been in budget state 'degraded' (>= 100% of its 20 USD/month limit) for 30 minutes - the bot is serving templates-only for that tenant."

      - alert: RouterInvalidRateHigh
        expr: increase(router_invalid_total[15m]) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "router responses are failing strict schema validation"
          description: "more than 5 router responses failed schema validation in 15 minutes - the provider's output shape may have changed."

      - alert: LlmBreakerOpen
        expr: llm_breaker_state == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "an LLM circuit breaker is open"
          description: "llm_breaker_state is 1 (open) for 5 minutes - the provider is being skipped and turns are falling back to templates/handoff."

      - alert: LlmFailureRatioHigh
        expr: >-
          sum(rate(llm_calls_total{status!="ok"}[10m]))
          / clamp_min(sum(rate(llm_calls_total[10m])), 0.0001)
          > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM call failure ratio is above 20%"
          description: "more than 20% of LLM calls have failed (non-ok status) over 10 minutes - the provider may be degrading."

  # P1.5b (embedding + vector search + rolling summary): three rules (PROMPT
  # §5.7). Absence/health is measured via up/absent by the existing CoreDown rules
  # (D3) - never by a metric that is simply 0 when nothing has failed.
  - name: sharwa_ai_p1_5b
    rules:
      - alert: EmbedQueueBacklog
        expr: embed_queue_depth > 1000
        for: 60m
        labels:
          severity: warning
        annotations:
          summary: "product embedding queue is backed up"
          description: "embed_queue_depth is above 1000 for 60 minutes - the catalog is being embedded slower than it changes; vector search is silently absent for those products (H42)."

      - alert: EmbedDimMismatch
        expr: increase(embed_dim_mismatch_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "an embedding provider returned a vector of the wrong width"
          description: "embed_dim_mismatch_total increased in the last 5 minutes - the H44 vector-width contract (1024) is being violated; investigate immediately."

      - alert: VectorSearchSkippedHigh
        expr: >-
          sum(rate(search_vector_skipped_total[30m]))
          / clamp_min(sum(rate(search_queries_total[30m])), 0.0001)
          > 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "the vector source is being skipped for over half of searches"
          description: "more than 50% of searches skipped the vector source over 30 minutes - the embedding provider or budget is likely unavailable; lexical search is still serving (H42)."

  # P1.6 (output verifier): four rules (PROMPT §7). Built on staleness/rate, not
  # absence (lesson P1.3b D3) - except VerifierBlocklistEmpty, whose whole point
  # is to catch an accidentally-empty blocklist while verify_enabled still reads 1.
  - name: sharwa_ai_p1_6
    rules:
      - alert: VerifierDisabled
        expr: verify_enabled == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "the output verifier is disabled"
          description: "verify_enabled has been 0 for 5 minutes - turning the output verifier off in production is an incident, never a silent default."

      - alert: VerifierViolationSpike
        expr: rate(verify_violations_total[15m]) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "verifier violations are spiking"
          description: "the 15-minute rate of verify_violations_total is above 10 - either a prompt-injection attack or a blocklist rule producing false positives; both need a human look."

      - alert: VerifierInternalErrors
        expr: rate(verify_errors_total[10m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "the output verifier is failing closed"
          description: "verify_errors_total increased in the last 10 minutes - every verifier error means a customer got a safe template instead of a correct reply (H47)."

      - alert: VerifierBlocklistEmpty
        expr: verify_blocklist_phrases{category="profanity"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "the profanity blocklist is empty"
          description: "verify_blocklist_phrases{category=\"profanity\"} is 0 for 5 minutes - an empty list is a toothless verifier while verify_enabled reassuringly reads 1."

  # P1.7 (order tracking): five rules (PROMPT §8). Built on rate/change, not
  # absence (lesson P1.3b D3).
  - name: sharwa_ai_p1_7
    rules:
      - alert: OrderLookupDeniedSpike
        expr: rate(order_lookup_total{outcome="denied"}[15m]) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "order-lookup denials are spiking"
          description: "the 15-minute rate of order_lookup_total{outcome=\"denied\"} is above 5 - either brute-force guessing or a wrong order-ref pattern; both need a human look."

      - alert: OrderLookupBlockedRising
        expr: rate(order_lookup_total{outcome="blocked"}[1h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "order-lookup brute-force blocking is active"
          description: "order_lookup_total{outcome=\"blocked\"} increased in the last hour - the 3/24h or 5/24h threshold is closing paths; a human should see this."

      - alert: CommerceLookupUnavailable
        expr: rate(order_lookup_platform_errors_total[10m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "the commerce order-lookup API is unavailable"
          description: "order_lookup_platform_errors_total increased in the last 10 minutes - order tracking is failing to the unavailable template."

      - alert: ToolsDisabled
        expr: tools_enabled == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "the tools layer is disabled"
          description: "tools_enabled has been 0 for 15 minutes - order-status turns fall back to handoff; visible, but should not be the silent default."

      - alert: ConsoleRateLimitHitsRising
        expr: increase(rate_limit_hits_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "console rate limiting is active"
          description: "rate_limit_hits_total increased in the last 10 minutes - a console route group (read/write/ticket) is rejecting requests above its ceiling; either real abuse or a ceiling that needs calibration (OQ-P1-30)."

      - alert: ConsoleRateLimitFailOpen
        expr: increase(rate_limit_fail_open_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "console rate limiting is failing open"
          description: "rate_limit_fail_open_total increased - redis-cache is unavailable so console requests are passing uncapped; the console stays up (H59) but abuse protection is off."

  # P2.3 (back-in-stock): three rules (PROMPT §7), built on rate/stall, not
  # absence of data.
  - name: sharwa_ai_p2_3
    rules:
      - alert: StockObservationStale
        expr: rate(stock_observation_stale_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "the platform stock observation is stale"
          description: "stock_observation_stale_total increased - the platform is late with stock observations, so waiters are neither allocated nor notified (H73: never guess availability)."

      - alert: StockHoldsExpiringUnconverted
        expr: rate(stock_holds_total{action=\"expired\"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "stock holds are expiring before conversion"
          description: "stock_holds_total{action=\"expired\"} increased - either the notification is not reaching the customer or STOCK_HOLD_TTL_S is too short; both need a human look (H71)."

      - alert: StockSweepStalled
        expr: increase(stock_sweep_runs_total[10m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "the back-in-stock sweep has stopped"
          description: "stock_sweep_runs_total has not increased in 10 minutes - the sweep thread is stalled, so waiting customers will never be promoted."



