# ops/postgres.conf
# PostgreSQL 16 runtime config (PROMPT_P0 §6 P0.1 step 2). Mounted read-only at
# /etc/postgresql/postgresql.conf and selected via `-c config_file=...`.
#
# Tuning follows docs/reference/docker-compose.reference.yml (postgres command
# flags) and 00_ARCHITECTURE.md §6: shared_buffers 512MB, work_mem 8MB so that
# work_mem x active connections stays far below the 1536m mem_limit.
# UTF-8 + C.UTF-8 locale are enforced at initdb (see ops/postgres/Dockerfile),
# not here.

# --- paths (must match the postgres image's PGDATA) ---
data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'

# --- connection budget (00 §6): 60 backend connections, ~8 reserved direct ---
max_connections = 60

# --- memory (risk #16) ---
shared_buffers = 512MB
work_mem = 8MB
maintenance_work_mem = 128MB
effective_cache_size = 1GB

# --- operational safety ---
idle_in_transaction_session_timeout = 10000   # kill transactions left open (e.g. across an LLM call)
log_min_duration_statement = 500
password_encryption = scram-sha-256
