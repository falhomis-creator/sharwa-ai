;; ops/pgbouncer.ini
;; Canonical PgBouncer config (PROMPT_P0 §6 P0.1 step 3; 00_ARCHITECTURE.md §6
;; connection budget). Mounted read-only at /etc/pgbouncer/pgbouncer.ini.
;;
;; The edoburu/pgbouncer entrypoint does NOT overwrite a mounted ini; it only
;; appends the userlist entry from DB_USER/DB_PASSWORD (generated at startup
;; from .env, never committed).

[databases]
;; All databases connect to the postgres service on the internal data network.
* = host=postgres port=5432

[pgbouncer]
listen_addr = *
listen_port = 5432

;; SCRAM-SHA-256 matches PostgreSQL's password_encryption (see ops/postgres.conf).
;; The userlist.txt (auth_file) is generated at startup from .env by the image.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; transaction pooling is safe with SET LOCAL app.tenant_id (RLS) per txn.
pool_mode = transaction
default_pool_size = 25
reserve_pool_size = 5

;; 400 cheap client connections; ~8 direct connections are reserved for
;; maintenance/migrations outside the pool (00 §6 connection budget).
max_client_conn = 400

server_reset_query = DISCARD ALL
