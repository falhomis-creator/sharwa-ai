;; ops/pgbouncer.ini
;; Canonical PgBouncer config (PROMPT_P0 §6 P0.1 step 3; 00_ARCHITECTURE.md §6
;; connection budget). Mounted read-only at /etc/pgbouncer/pgbouncer.ini.
;;
;; Per the edoburu/pgbouncer README the entrypoint does NOT overwrite a mounted
;; ini (it only appends a userlist entry from DB_USER/DB_PASSWORD, generated at
;; startup from .env, never committed). This behavior is UNVERIFIED on the VPS
;; and must be confirmed with a real boot (audit B4).

[databases]
;; All databases connect to the postgres service on the internal data network.
* = host=postgres port=5432

[pgbouncer]
listen_addr = *
listen_port = 5432

;; SCRAM-SHA-256 matches PostgreSQL's password_encryption (see ops/postgres.conf).
;; The userlist.txt (auth_file) is generated at startup from .env by the image.
;;
;; Userlist decision (audit B4): PgBouncer serves the application tier with the
;; single DB_USER (sharwa_app login). sharwa_system and the migration user do NOT
;; go through PgBouncer; they connect directly to postgres within the ~8 reserved
;; direct maintenance connections (00 §6). Recorded in docs/P0_DEVIATIONS.md.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; transaction pooling is safe with SET LOCAL app.tenant_id (RLS) per txn.
pool_mode = transaction
default_pool_size = 25
reserve_pool_size = 5

;; 400 cheap client connections; ~8 direct connections are reserved for
;; maintenance/migrations outside the pool (00 §6 connection budget).
max_client_conn = 400

;; Cap server-side connections: default_pool_size applies per (db,user) pair, so
;; with app+system users it could exceed the 60-connection budget. 30 = 25 + 5
;; reserve (audit B4).
max_db_connections = 30

;; Explicit idle/timeout behavior (audit B4). No server_reset_query: DISCARD ALL
;; is not used in transaction pooling.
query_wait_timeout = 120
server_idle_timeout = 600
