# ops/redis-cache.conf
# Lossy cache (risk #5): dedupe fast-path, rate limits, pub/sub, read cache.
# This store is explicitly rebuildable and may be flushed without data loss.
#
# Rule (PROMPT_P0 §6 P0.1 step 5): no code may write anything that "must not be
# lost" here. allkeys-lru keeps writes succeeding under memory pressure by
# evicting any key.
# requirepass is injected via the compose command line from .env (never committed).

bind * -::*
protected-mode yes
port 6379

appendonly no
save ""

maxmemory 96mb
maxmemory-policy allkeys-lru
