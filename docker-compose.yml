# =============================================================================
# Sharwa AI - docker-compose.yml (P0.1 data tier DRAFT - NOT run: no Docker yet)
#
# Derived from docs/reference/docker-compose.reference.yml. Originally scoped to
# the P0.1 data layer only (PROMPT_P0 §6 P0.1 step 1); P0.1 was verified on real
# Docker at C1 (docs/P0_C1_REPORT.md) - this file is no longer a "not run" draft.
# P0.2 (R3_DIRECTIVE) adds the `gateway`/`gateway-forwarder` app tier below.
# worker-*/scheduler/api/prometheus remain ABSENT - still out of scope.
#
# Rules applied:
#   - every container has mem_limit + memswap_limit + cpus + pids_limit + log cap
#     + restart + healthcheck (risk #16).
#   - PostgreSQL gets oom_score_adj: -900 and lives on the internal `data` network
#     (never published to the host) - risk #16 / #2.
#   - redis-durable uses AOF fsync=always + noeviction; redis-cache is lossy
#     allkeys-lru with no persistence (risk #17 / #5).
#   - secrets come from a gitignored root `.env` via ${VAR:?error} - no defaults.
#   - every image tag is an explicit version - NO `latest` (deviation from the
#     reference is recorded in docs/P0_DEVIATIONS.md).
#
# Memory budget: data tier (postgres 1536 + pgbouncer 64 + redis-durable 320 +
# redis-cache 128 = 2048 MB) + app tier (gateway 512 + gateway-forwarder 128 =
# 640 MB) = 2688 MB, leaving ~5.3 GB of an 8 GB host for the OS, page cache, and
# the still-absent api/prometheus tiers. The gateway/gateway-forwarder limits
# are a FIRST-PASS ESTIMATE (Baileys per-session memory not yet load-tested
# under P0.2) - revisit once real WhatsApp sessions run under load.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------- data tier
  postgres:
    build: ./ops/postgres                 # postgis/postgis:16-3.4 + postgresql-16-pgvector + pg_trgm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env)}
      # Role bootstrap (10_roles.sh) reads these; LOGIN roles inherit the base roles.
      SHARWA_APP_USER: ${SHARWA_APP_USER:?SHARWA_APP_USER is required (see .env)}
      SHARWA_APP_PASSWORD: ${SHARWA_APP_PASSWORD:?SHARWA_APP_PASSWORD is required (see .env)}
      SHARWA_SYSTEM_USER: ${SHARWA_SYSTEM_USER:?SHARWA_SYSTEM_USER is required (see .env)}
      SHARWA_SYSTEM_PASSWORD: ${SHARWA_SYSTEM_PASSWORD:?SHARWA_SYSTEM_PASSWORD is required (see .env)}
      SHARWA_MIGRATION_USER: ${SHARWA_MIGRATION_USER:?SHARWA_MIGRATION_USER is required (see .env)}
      SHARWA_MIGRATION_PASSWORD: ${SHARWA_MIGRATION_PASSWORD:?SHARWA_MIGRATION_PASSWORD is required (see .env)}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres.conf:/etc/postgresql/postgresql.conf:ro
    networks: [data]                      # internal only: reachable through PgBouncer, never from outside
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2.0
    pids_limit: 300
    oom_score_adj: -900                   # the kernel kills everything else first
    stop_grace_period: 60s
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0  # explicit tag (reference used :latest)
    environment:
      DB_HOST: postgres
      DB_USER: ${SHARWA_APP_USER:?SHARWA_APP_USER is required (see .env)}
      DB_PASSWORD: ${SHARWA_APP_PASSWORD:?SHARWA_APP_PASSWORD is required (see .env)}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required (see .env)}
      # auth_type + pool settings are also encoded in ops/pgbouncer.ini (mounted).
      AUTH_TYPE: scram-sha-256
    volumes:
      - ./ops/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    networks: [data]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging
    restart: unless-stopped

  redis-durable:                         # streams (inbound WAL) + lidmap + wake-ups. Never evicts.
    image: redis:7.4-alpine              # explicit tag (reference used :7-alpine)
    command:
      - sh
      - -c
      - exec redis-server /etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    environment:
      # B7: password via env (not argv). REDISCLI_AUTH lets the healthcheck
      # authenticate without -a on the command line.
      REDIS_PASSWORD: ${REDIS_DURABLE_PASSWORD:?REDIS_DURABLE_PASSWORD is required (see .env)}
      REDISCLI_AUTH: ${REDIS_DURABLE_PASSWORD:?REDIS_DURABLE_PASSWORD is required (see .env)}
    volumes:
      - ./ops/redis-durable.conf:/etc/redis/redis.conf:ro
      - redis_durable:/data
    networks: [data]
    mem_limit: 320m                       # B3: AOF rewrite headroom above maxmemory 128mb
    memswap_limit: 320m
    cpus: 0.5
    pids_limit: 50
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  redis-cache:                           # dedupe fast-path, rate limits, pub/sub, read cache. Losable.
    image: redis:7.4-alpine
    command:
      - sh
      - -c
      - exec redis-server /etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required (see .env)}
      REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required (see .env)}
    volumes:
      - ./ops/redis-cache.conf:/etc/redis/redis.conf:ro
    networks: [data]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 50
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # ---------------------------------------------------------------- app tier
  # P0.2 (R3_DIRECTIVE, disaster #4/G1 + #5/#17): the WA socket (gateway) and
  # the Django delivery path (gateway-forwarder) are separate containers/
  # processes so a slow/down Django never blocks inbound message receipt.
  gateway:
    stop_grace_period: 30s
    build:
      context: ./gateway
    image: sharwa-ai-gateway:p0.2          # tag shared with gateway-forwarder below (built once)
    environment:
      PORT: "4001"
      NODE_ENV: production
      SHARWA_AI_GATEWAY_API_KEY: ${SHARWA_AI_GATEWAY_API_KEY:?SHARWA_AI_GATEWAY_API_KEY is required (see .env)}
      SHARWA_AI_GATEWAY_WEBHOOK_SECRET: ${SHARWA_AI_GATEWAY_WEBHOOK_SECRET:?SHARWA_AI_GATEWAY_WEBHOOK_SECRET is required (see .env)}
      # host.docker.internal (below) is what makes these reachable when Django/
      # MinIO run on the VPS host itself rather than in this compose file -
      # "localhost" from INSIDE the container would mean the container itself.
      DJANGO_BASE_URL: ${DJANGO_BASE_URL:-http://host.docker.internal:8000}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://host.docker.internal:9000}
      # Optional (owner decision, P0.2): MinIO deployment status was unknown when
      # this was written. Left EMPTY here rather than :?required so `gateway` can
      # still start and handle text messages - sessions.js already degrades a
      # media upload gracefully (object_key: null, Arabic fallback text) when
      # these are unset/wrong. Set real values in .env once MinIO is confirmed.
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sharwa-ai}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      AUTH_SESSIONS_DIR: /app/auth_sessions
      REDIS_DURABLE_HOST: redis-durable
      REDIS_DURABLE_PORT: "6379"
      REDIS_DURABLE_PASSWORD: ${REDIS_DURABLE_PASSWORD:?REDIS_DURABLE_PASSWORD is required (see .env)}
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required (see .env)}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required - the gateway refuses to start without it (see .env)}
      # P1.0: single source of truth for shard count across gateway +
      # gateway-forwarder + worker-realtime (the shards are NOT live-redistributable
      # - changing this requires stopping all three together, see .env.example).
      INGEST_SHARDS: ${INGEST_SHARDS:-4}
      NODE_OPTIONS: --max-old-space-size=900
    volumes:
      - gateway_auth_sessions:/app/auth_sessions   # WhatsApp session credentials survive restarts
    networks: [data, app]                  # data: reach redis-durable. app: reach the internet (WhatsApp) + host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4001:4001"              # loopback only (Dockerfile: never published to the public internet)
    mem_limit: 1200m
    memswap_limit: 1200m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      redis-durable: { condition: service_healthy }
    logging: *default-logging
    restart: unless-stopped

  gateway-forwarder:                       # same image as `gateway`, different command - reads in:{shard}
    image: sharwa-ai-gateway:p0.2          # via the legacy-forwarder consumer group and delivers to Django
    command: ["node", "src/forwarder.js"]
    environment:
      NODE_ENV: production
      SHARWA_AI_GATEWAY_WEBHOOK_SECRET: ${SHARWA_AI_GATEWAY_WEBHOOK_SECRET:?SHARWA_AI_GATEWAY_WEBHOOK_SECRET is required (see .env)}
      DJANGO_BASE_URL: ${DJANGO_BASE_URL:-http://host.docker.internal:8000}
      REDIS_DURABLE_HOST: redis-durable
      REDIS_DURABLE_PORT: "6379"
      REDIS_DURABLE_PASSWORD: ${REDIS_DURABLE_PASSWORD:?REDIS_DURABLE_PASSWORD is required (see .env)}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required - the forwarder refuses to start without it (see .env)}
      FORWARDER_METRICS_PORT: ${FORWARDER_METRICS_PORT:-4002}
      INGEST_SHARDS: ${INGEST_SHARDS:-4}
    networks: [data, app]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 50
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:4002:4002"              # loopback only, mirrors gateway's own 4001 convention
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # P0.7: FastAPI channel-lifecycle backend (core/, see core/app/main.py and
  # core/Dockerfile). Its own schema (tenants/channel_accounts/kill_switches/
  # api_idempotency/...) lives in the SAME ${POSTGRES_DB} database as the
  # legacy Django app - this is not a second database, and 10_roles.sh's three
  # LOGIN roles are reused as-is, unchanged, not duplicated for `api`:
  #   - CORE_DATABASE_URL:           SHARWA_APP_USER,      through pgbouncer
  #                                  (RLS-bound app role, transaction pooling)
  #   - CORE_SYSTEM_DATABASE_URL:    SHARWA_SYSTEM_USER,   direct to postgres
  #                                  (SECURITY DEFINER-only role)
  #   - CORE_MIGRATION_DATABASE_URL: SHARWA_MIGRATION_USER, direct to postgres
  #                                  (schema-owning role; not read by the
  #                                  running server, only by `app.cli migrate`)
  # The system/migration roles bypass PgBouncer deliberately: ops/pgbouncer.ini's
  # own userlist decision only ever puts SHARWA_APP_USER in PgBouncer's
  # userlist.txt (auto-generated from pgbouncer's own DB_USER/DB_PASSWORD env
  # above) - a connection authenticating as any other role would simply be
  # refused by PgBouncer, so this is not a style choice, it is the only wiring
  # that can work at all against the real ops/pgbouncer.ini shipped here.
  #
  # All three DSNs are built with libpq keyword=value conninfo strings
  # (`host=... user=... password=...`), never a `postgresql://` URI - a
  # generated password containing @, /, %, or # would silently corrupt a URI
  # (these characters are ordinary in a generated secret; none of them need
  # escaping in keyword=value form).
  api:
    build:
      context: ./core
    image: sharwa-ai-core:p1.0            # P1.0: shared tag with worker-realtime (built once, same image)
    environment:
      ENV: production                      # P4.1: explicit (also the code default)
      API_WORKERS: ${API_WORKERS:-2}
      # P4.1: dashboard (frontend/) served same-origin on /console/ from the read-only mount below.
      CONSOLE_STATIC_DIR: /app/frontend
      # H103/H104: the marketing preflight reads these in the API process too.
      MARKETING_FOOTER_AR: ${MARKETING_FOOTER_AR:-}
      MARKETING_MIN_WARMUP_DAYS: ${MARKETING_MIN_WARMUP_DAYS:-3}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required (see .env)}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required (see .env)}
      # One of these two is required (the api refuses to boot with neither) -
      # JWKS_URL is the active default; set JWT_PUBLIC_KEY_PEM in .env instead
      # if you need the static-PEM fallback (leave JWKS_URL empty then).
      JWKS_URL: ${JWKS_URL:-}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
      CORE_DATABASE_URL: "host=pgbouncer port=5432 dbname=${POSTGRES_DB} user=${SHARWA_APP_USER} password=${SHARWA_APP_PASSWORD}"
      CORE_SYSTEM_DATABASE_URL: "host=postgres port=5432 dbname=${POSTGRES_DB} user=${SHARWA_SYSTEM_USER} password=${SHARWA_SYSTEM_PASSWORD}"
      CORE_MIGRATION_DATABASE_URL: "host=postgres port=5432 dbname=${POSTGRES_DB} user=${SHARWA_MIGRATION_USER} password=${SHARWA_MIGRATION_PASSWORD}"
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required (see .env)}
      # http://gateway:4001 - the internal Docker network hostname (both
      # containers are members of `app`), never the host-published
      # 127.0.0.1:4001 loopback, which is not reachable from inside another
      # container.
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://gateway:4001}
      # Reuses the SAME secret the gateway's own HTTP API already requires
      # (SHARWA_AI_GATEWAY_API_KEY) rather than inventing a second one - core/
      # sends it back as the X-API-Key header on every gateway call.
      GATEWAY_API_KEY: ${SHARWA_AI_GATEWAY_API_KEY:?SHARWA_AI_GATEWAY_API_KEY is required (see .env)}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required - the api service refuses to start without it (see .env)}
      SSO_LOGIN_URL: ${SSO_LOGIN_URL:?SSO_LOGIN_URL is required (see .env)}
      # P4 Task 17 (F-P4-11): passed through so the public domain works. Empty
      # (the default) = exactly today's behaviour. CONSOLE_ALLOWED_ORIGINS is the
      # console's own public origin (https://ai.sharwaah.com): the /v1/ws handshake
      # checks the browser Origin against it (api/ws.py). CONSOLE_SSO_PLATFORM_ORIGINS
      # = the Sharwa store origins allowed to hand the console a token (Task 6b).
      CONSOLE_ALLOWED_ORIGINS: ${CONSOLE_ALLOWED_ORIGINS:-}
      CONSOLE_SSO_PLATFORM_ORIGINS: ${CONSOLE_SSO_PLATFORM_ORIGINS:-}
      # P1.4 catalog webhook HMAC secret (app/config.py _required - empty refuses boot, H5).
      PLATFORM_WEBHOOK_SECRET: ${PLATFORM_WEBHOOK_SECRET:?PLATFORM_WEBHOOK_SECRET is required (see .env)}
    networks: [data, app]                  # data: postgres/pgbouncer/redis-cache. app: gateway + outbound (JWKS_URL)
    volumes:
      - ./frontend:/app/frontend:ro        # P4.1: console static files (no build step)
    ports:
      # loopback only. Host 8000 -> container 8080 (P4.1). Reach it with an SSH tunnel or the TLS proxy.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8080"
    mem_limit: 512m                        # P4.1: 256m -> 512m for API_WORKERS=2
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 150
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      postgres: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      gateway: { condition: service_healthy }
    logging: *default-logging
    restart: unless-stopped

  # P1.0: realtime ingest worker (core/, same image as `api`, different command).
  # Reads in:{shard} via the ai-core-ingest consumer group and commits each
  # entry to PostgreSQL in one transaction (P1.0+P1.1). Same role wiring as
  # `api`: CORE_DATABASE_URL via pgbouncer (RLS app role), CORE_SYSTEM_DATABASE_URL
  # direct to postgres (SECURITY DEFINER-only role). On [data, app] like `api` so
  # prometheus (app network) can reach /healthz + /metrics on :4003.
  worker-realtime:
    image: sharwa-ai-core:p1.0
    # P4.1: opt-in profile. P4.2: the worker NOW BOOTS under ENV=production with
    # the real DeepSeek provider (LLM_PROVIDER=deepseek + DEEPSEEK_API_KEY in
    # .env.prod); embeddings default to `local` (deterministic, no network -
    # DeepSeek exposes no embeddings endpoint). Start it explicitly:
    # `docker compose --profile engine up -d worker-realtime` (see
    # docs/VPS_DEPLOYMENT_PLAYBOOK.md §8.5).
    profiles: ["engine"]
    command: ["worker"]                      # entrypoint.sh role -> python -m app.workers.realtime
    environment:
      ENV: production
      CORE_DATABASE_URL: "host=pgbouncer port=5432 dbname=${POSTGRES_DB} user=${SHARWA_APP_USER} password=${SHARWA_APP_PASSWORD}"
      CORE_SYSTEM_DATABASE_URL: "host=postgres port=5432 dbname=${POSTGRES_DB} user=${SHARWA_SYSTEM_USER} password=${SHARWA_SYSTEM_PASSWORD}"
      REDIS_DURABLE_HOST: redis-durable
      REDIS_DURABLE_PORT: "6379"
      REDIS_DURABLE_PASSWORD: ${REDIS_DURABLE_PASSWORD:?REDIS_DURABLE_PASSWORD is required (see .env)}
      # P1.3b (W5): the workers publish committed inbox_events to redis-cache
      # Pub/Sub (tenant:{id}:inbox) for the api's live WebSocket feed.
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required (see .env)}
      INGEST_SHARDS: ${INGEST_SHARDS:-4}
      CORE_WORKER_METRICS_PORT: ${CORE_WORKER_METRICS_PORT:-4003}
      # N4: same dedupe-done TTL the gateway already reads, from ONE variable,
      # so a future tuning can't silently diverge between gateway and worker.
      DEDUPE_DONE_TTL_S: ${DEDUPE_DONE_TTL_S:-172800}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required - the worker refuses to start without it (see .env)}
      # P1.7 order-tracking HMAC key (workers/config.py _required, H54): a long
      # random value generated ONCE and kept stable - changing it resets the
      # "5 rejections per order" counter because all prior fingerprints stop matching.
      ORDER_REF_HASH_KEY: ${ORDER_REF_HASH_KEY:?ORDER_REF_HASH_KEY is required (see .env)}
      # P4.1: required by workers/config.py (the old file lacked them => crash on boot).
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://gateway:4001}
      GATEWAY_API_KEY: ${SHARWA_AI_GATEWAY_API_KEY:?SHARWA_AI_GATEWAY_API_KEY is required (see .env)}
      # P4.2: DeepSeek is the real LLM (OpenAI-compatible API). An empty
      # DEEPSEEK_API_KEY makes the worker itself refuse to boot (H5,
      # workers/config.py) with a clear message; `:?` is deliberately NOT used
      # here so the default (non-engine) stack keeps booting before the owner
      # adds the key to .env.prod.
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # DeepSeek exposes no embeddings endpoint; `local` is the deterministic
      # no-network provider (production-safe; `fake` still refuses to boot).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      MARKETING_FOOTER_AR: ${MARKETING_FOOTER_AR:-}
      MARKETING_MIN_WARMUP_DAYS: ${MARKETING_MIN_WARMUP_DAYS:-3}
    networks: [data, app]                  # data: pg/pgbouncer/redis-durable/redis-cache. app: prometheus scrape target
    mem_limit: 512m                        # P1.2: raised 384m -> 512m for the turn/dispatch/evt thread groups
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 100
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      postgres: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      redis-durable: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
    logging: *default-logging
    restart: unless-stopped

  # P0.6 Batch C: scrapes gateway:4001 and gateway-forwarder:4002 (see
  # ops/prometheus/prometheus.yml). P1.0 adds api:8080 and worker-realtime:4003
  # as scrape targets there (ops/prometheus/prometheus.yml was read for real
  # and updated in the same change), closing the P0.7 "follow-up" deferral.
  prometheus:
    image: prom/prometheus:v3.14.0       # explicit tag - confirmed pullable on this VPS; no `:latest` (project rule)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # bounds disk given the host's memory/disk budget below
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Generated by the delivery script from .env's METRICS_TOKEN at delivery
      # time - gitignored, never committed (see .gitignore).
      - ./ops/prometheus/secrets/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    networks: [app]                        # both scrape targets are members of `app`; no need for `data` too
    ports:
      - "127.0.0.1:9090:9090"               # loopback only, same convention as gateway/gateway-forwarder
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      gateway: { condition: service_healthy }
      gateway-forwarder: { condition: service_healthy }
    logging: *default-logging
    restart: unless-stopped

networks:
  data:
    driver: bridge
    internal: true                       # databases/Redis cannot be reached from outside
  app:
    driver: bridge                       # NOT internal: gateway needs outbound internet (WhatsApp)
                                          # and a route to Django/MinIO on the host (host.docker.internal)

volumes:
  prometheus_data:
  pgdata:
  redis_durable:
  gateway_auth_sessions:
